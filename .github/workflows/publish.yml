name: Publish to NPM

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - package.json

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # allow npm trusted publishing (OIDC), preferred over NPM_TOKEN when configured
      id-token: write
    steps:
      - name: Checkout git repository 🛒
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Setup mise ⚙️
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4

      - name: Install dependencies 🔧
        # include devDependencies https://stackoverflow.com/a/64648870
        run: npm ci --audit=false --include=dev --include=optional --include=peer

      - name: Build package 🏗️
        run: npm run build

      - name: Publish package on NPM 📦
        # auth via npm trusted publishing (OIDC), no token needed
        run: npm publish
