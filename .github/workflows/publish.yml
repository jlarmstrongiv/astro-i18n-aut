name: Publish to NPM

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - package.json

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # allow npm trusted publishing (OIDC), preferred over NPM_TOKEN when configured
      id-token: write
    steps:
      - name: Checkout git repository 🛒
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup mise ⚙️
        uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          version: 2026.10.11

      - name: Install dependencies 🔧
        # include devDependencies https://stackoverflow.com/a/64648870
        run: npm ci --audit=false --include=dev --include=optional --include=peer

      - name: Build package 🏗️
        run: npm run build

      - name: Publish package on NPM 📦
        # auth via npm trusted publishing (OIDC), no token needed
        run: npm publish
