name: Publish to NPM

on:
  push:
    branches:
      - main
    paths:
      - package.json

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout git repository 🛒
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Setup mise ⚙️
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0

      - name: Install dependencies 🔧
        # include devDependencies https://stackoverflow.com/a/64648870
        run: npm ci --audit=false --include=dev --include=optional --include=peer

      - name: Build package 🏗️
        run: npm run build

      - name: Publish package on NPM 📦
        run: |
          npm config set "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" --location=user
          npm publish
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
